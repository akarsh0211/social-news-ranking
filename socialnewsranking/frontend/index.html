<!DOCTYPE html>
<html>
<head>
    <title>Trending News</title>
</head>
<body>

<h1>Trending News</h1>
<ul id="newsList"></ul>

<script>
fetch("http://localhost:8080/trending")
    .then(res => res.json())
    .then(data => {

        const list = document.getElementById("newsList");

        data.forEach(item => {
            const li = document.createElement("li");
            li.innerText = item.title + " - Score: " + item.score;
            list.appendChild(li);
        });
    });
</script>

</body>
</html>
